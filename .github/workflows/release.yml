name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Run tests
      run: go test ./...

    - name: Get version
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        mkdir -p build/packages
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/cli-snitch-amd64 ./cmd/cli-snitch
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/cli-snitch-arm64 ./cmd/cli-snitch
        cd build
        tar -czf packages/cli-snitch-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz -C . cli-snitch-amd64
        tar -czf packages/cli-snitch-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz -C . cli-snitch-arm64
        cd packages && shasum -a 256 *.tar.gz > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: CLI Snitch ${{ steps.version.outputs.version }}
        body: |
          ## CLI Snitch ${{ steps.version.outputs.version }}

          ### Install via Homebrew
          ```bash
          brew tap nickciolpan/tap
          brew install cli-snitch
          ```

          ### Manual install
          1. Download the binary for your architecture below
          2. Extract: `tar -xzf cli-snitch-*.tar.gz`
          3. Move: `sudo mv cli-snitch-* /usr/local/bin/cli-snitch && chmod +x /usr/local/bin/cli-snitch`

          ### Quick start
          ```bash
          sudo cli-snitch watch
          ```
        files: |
          build/packages/cli-snitch-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz
          build/packages/cli-snitch-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
          build/packages/checksums.txt
